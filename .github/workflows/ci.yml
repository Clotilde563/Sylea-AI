name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:
    branches: [master, main]

# Supply-chain hardening : les actions sont epinglees au SHA de commit (et non
# a un tag mobile @v4 qui peut etre re-pointe par un attaquant ayant compromis
# le repo de l'action). Le commentaire indique la version lisible correspondante.
jobs:
  # ─── Tests backend Python ──────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (suite critique migration)
        env:
          ANTHROPIC_API_KEY: ""  # Tests qui en ont besoin sont skippes
        run: |
          python -m pytest tests/test_db_adapter.py \
                            tests/test_repositories_async.py \
                            tests/test_qa_fixes.py \
                            tests/test_api_profil.py \
                            tests/test_api_dilemme.py \
                            tests/test_agent3_phase9.py \
                            tests/test_agent3_phase7.py \
                            tests/test_context_completeness.py \
                            -v --tb=short

  # ─── Tests frontend ────────────────────────────────────────────────────────
  frontend-tests:
    name: Frontend tests (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Vitest
        working-directory: frontend
        run: npm test

  # ─── Migration audit ────────────────────────────────────────────────────────
  migration-audit:
    name: Audit PG migration coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Check requirements.txt has PG deps
        run: |
          grep -q "^sqlalchemy" requirements.txt
          grep -q "^asyncpg" requirements.txt
          grep -q "^psycopg2" requirements.txt
          grep -q "^alembic" requirements.txt
          echo "All PG deps present in requirements.txt"

      - name: Check .env.example has critical vars
        run: |
          grep -q "JWT_SECRET_KEY" .env.example
          grep -q "DATABASE_URL" .env.example
          grep -q "SYLEA_CREDENTIALS_MASTER_KEY" .env.example
          echo "All critical env vars documented"
