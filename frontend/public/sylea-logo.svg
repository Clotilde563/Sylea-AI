<!-- Logo Syléa.AI — S stylisé, gradient cyan → bleu → violet, canal central blanc.
     Pas de cadre carré : fond transparent, le navigateur ou l'OS dessine le bord. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradient rose Syléa (bas profond → haut pâle) -->
    <linearGradient id="sl-grad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%"   stop-color="#9f1239"/>
      <stop offset="30%"  stop-color="#be185d"/>
      <stop offset="65%"  stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <!-- Halo flou pour la lueur extérieure (région étendue pour éviter
         le rectangle visible autour du logo) -->
    <filter id="sl-halo" x="-100%" y="-100%" width="300%" height="300%"
            filterUnits="objectBoundingBox">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Halo atmosphérique (gradient + flou) -->
  <path
    d="M 60 21 C 88 21, 88 45, 60 54 C 32 63, 32 87, 60 87"
    stroke="url(#sl-grad)" stroke-width="30" fill="none" stroke-linecap="round"
    style="filter: url(#sl-halo); opacity: 0.22"/>

  <!-- Couche 1 : bordure extérieure sombre (donne la profondeur) -->
  <path
    d="M 60 21 C 88 21, 88 45, 60 54 C 32 63, 32 87, 60 87"
    stroke="rgba(2,4,16,0.97)" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Couche 2 : corps en gradient (2 rails de chaque côté du canal) -->
  <path
    d="M 60 21 C 88 21, 88 45, 60 54 C 32 63, 32 87, 60 87"
    stroke="url(#sl-grad)" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Couche 3 : canal central creux -->
  <path
    d="M 60 21 C 88 21, 88 45, 60 54 C 32 63, 32 87, 60 87"
    stroke="#050810" stroke-width="6" fill="none" stroke-linecap="butt"/>

  <!-- Couche 4 : reflet spéculaire rose pâle -->
  <path
    d="M 60 21 C 88 21, 88 45, 60 54 C 32 63, 32 87, 60 87"
    stroke="rgba(255,205,225,0.65)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
