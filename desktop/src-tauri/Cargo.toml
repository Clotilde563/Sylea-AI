[package]
name = "sylea-agent"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Notifications OS natives : Windows toast (Action Center), macOS NSUserNotification.
# Utilise pour le systeme tracking des dilemmes : J+30/60/90 reminders +
# D+3/7 validation reminders. Le frontend appelle `notify` via API JS.
tauri-plugin-notification = "2"
# Deep-link : recoit sylea://auth/callback?token=... apres Sign in with Google
# /Apple via le navigateur systeme. Enregistre automatiquement le scheme
# sylea:// au boot de l'app.
tauri-plugin-deep-link = "2"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Parsing d'URL pour intercepter le redirect OAuth Google dans la popup
# embarquee (extrait le `code` query param sans charger la page localhost).
url = "2"
# Audio capture cross-platform pour la feature "Ecoute active" (cours
# universite/prepa). cpal expose le microphone en streaming, hound serialise
# en WAV PCM 16-bit mono qu'on chunke par 30s sur disque (faster-whisper
# consume du WAV nativement, pas besoin d'encoder Opus en sprint 1).
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.5"

# Single-instance : OBLIGATOIRE sur Windows/Linux pour que les deep-links
# soient forwardes a l'instance existante au lieu d'en spawner une nouvelle.
# Sans ce plugin, chaque clic sur un lien sylea:// ouvre une 2e fenetre.
# La feature "deep-link" cable automatiquement le hook ; il faut quand meme
# enregistrer le plugin dans main.rs avec un callback qui recoit les args
# (URL deep-link incluse) et les emit vers le handler deep-link existant.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Wake lock — empeche le laptop de se mettre en veille pendant 4h de recording.
# Cross-platform : Windows utilise SetThreadExecutionState (ES_DISPLAY_REQUIRED
# | ES_SYSTEM_REQUIRED | ES_CONTINUOUS).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Power"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
