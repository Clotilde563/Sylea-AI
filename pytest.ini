[pytest]
# Configuration pytest pour Syléa.AI
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers custom (cf. tests/conftest.py)
markers =
    e2e: Tests end-to-end qui lancent un mock Gateway local
    slow: Tests lents (> 5s) — skipper en local rapide

# Filtres warnings
filterwarnings =
    # Warnings deprecation Python 3.13 (utcnow, etc.) — non bloquants
    ignore::DeprecationWarning:tests.*
    # Warnings FastAPI on_event deprecated — migration lifespan a faire plus tard
    ignore::DeprecationWarning:fastapi.*

# Output
addopts =
    --strict-markers
    --tb=short
    -ra

# Asyncio mode (cf. pytest-asyncio config)
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
